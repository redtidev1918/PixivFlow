# docsite-managed-file: update-download-page.yml
# docsite-managed-version: 2
# docsite: managed file, run `python3 docsite.py update` to refresh.
#
# 刷新下载页（docs/download.md 与语言镜像），并显式重建 Pages 文档站。
#
# 触发方式（按优先级）：
#   1. workflow_call / workflow_dispatch：传入精确 tag（ReleaseGraph post-release action 的入口）
#   2. release: published：手工发布或使用 PAT/App 创建的 Release 的兜底（exact tag 取自事件）
#      —— GITHUB_TOKEN 创建的 Release 不会触发该事件；那种情况必须走入口 1。
#   3. 不传 tag 时生成器回落到最新 stable Release，并在日志中明确说明。
#
# 使用既有 release PAT 创建下载页 PR，以触发必需投递检查；通过后合并，
# 再显式 dispatch 文档站 workflow（默认 docs.yml，可在
# .github/scripts/download-page.json 的 docsWorkflow 覆盖）。
name: Update download page

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
      deploy-docs:
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
      deploy-docs:
        type: boolean
        required: false
        default: true
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write
  actions: write # 显式 dispatch 文档站 workflow（GITHUB_TOKEN 的 push 不会触发 push 型 workflow）

concurrency:
  group: update-download-page
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      tag: ${{ steps.render.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Resolve exact tag
        id: resolve
        run: |
          EXACT="${{ inputs.tag || github.event.release.tag_name }}"
          if [ -n "$EXACT" ]; then
            echo "tag=$EXACT" >> "$GITHUB_OUTPUT"
            echo "source=explicit"
          else
            echo "source=latest-stable"
          fi

      - name: Regenerate download pages
        id: render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if [ -n "$TAG" ]; then
            python3 .github/scripts/update_download_page.py "${{ github.repository }}" --tag "$TAG"
          else
            python3 .github/scripts/update_download_page.py "${{ github.repository }}"
          fi
          echo "tag=${TAG:-latest}" >> "$GITHUB_OUTPUT"

      # Local protection adapter: keep this PR path when refreshing the docsite template.
      # GITHUB_TOKEN pushes do not trigger checks; the existing release PAT does.
      - name: Update protected branch through a checked PR
        id: commit
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ steps.render.outputs.tag }}
          BASE: ${{ github.event.repository.default_branch }}
          BRANCH: codex/download-page-${{ github.run_id }}-${{ github.run_attempt }}
          REQUIRED_CHECK: TelePost delivery contract
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "download page already up to date"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is required to trigger protected-branch checks"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git switch -c "$BRANCH"
          git commit -m "docs: refresh download page ($TAG)"
          git push origin "$BRANCH"
          pr=$(gh pr create --base "$BASE" --head "$BRANCH" \
            --title "docs: refresh download page ($TAG)" \
            --body "Regenerate download links for the exact release tag. Merge only after CI passes.")
          # Wait until the required check exists, then observe every emitted check.
          # No bypass or direct default-branch push, including on retries.
          registered=false
          for attempt in $(seq 1 30); do
            names=$(gh pr checks "$pr" --json name --jq '.[].name' || true)
            if printf '%s\n' "$names" | grep -Fxq "$REQUIRED_CHECK"; then
              registered=true
              break
            fi
            sleep 10
          done
          if [ "$registered" != true ]; then
            echo "::error::Required delivery check was not registered; leaving PR open"
            exit 1
          fi
          gh pr checks "$pr" --watch --interval 20
          gh pr merge "$pr" --squash --delete-branch
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild docs site (explicit dispatch)
        # release 事件下 inputs 为空。GitHub 表达式比较不同类型时会各自转成数字，
        # null 与 false 都变成 0，`inputs.deploy-docs != false` 会被判成假 →
        # 这一整步被跳过，而"发版后没重建 Pages"正是 v2 要修的 bug。
        # 改成按事件名短路，只依赖布尔真值与 event_name 比较，不依赖隐式转换。
        if: steps.commit.outputs.changed == 'true' && (github.event_name == 'release' || inputs.deploy-docs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORKFLOW="docs.yml"
          if [ -f .github/scripts/download-page.json ]; then
            WORKFLOW="$(python3 -c 'import json,sys;print(json.load(open(".github/scripts/download-page.json")).get("docsWorkflow","docs.yml"))' 2>/dev/null || echo docs.yml)"
          fi
          gh workflow run "$WORKFLOW" --ref "${{ github.event.repository.default_branch }}"
