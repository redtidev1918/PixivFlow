name: Test

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npx jest --ci --runInBand

  scheduler-image:
    name: Scheduler source image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build current source
        run: docker build -f Dockerfile.scheduler --build-arg VCS_REF="$GITHUB_SHA" -t pixivflow-scheduler:test .

      - name: Verify source and revision
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' pixivflow-scheduler:test)" = "$GITHUB_SHA"
          docker run --rm -e EXPECTED_REVISION="$GITHUB_SHA" --entrypoint sh pixivflow-scheduler:test -c 'test ! -e /usr/local/bin/pixivflow && test -f /app/dist/index.js && test "$PIXIVFLOW_REVISION" = "$EXPECTED_REVISION"'
