name: Release

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      version: {description: "Existing version; blank reads the manifest", required: false, type: string}
      dry_run: {description: "Build and validate without publishing", required: false, default: false, type: boolean}
      force: {description: "Rerun a healthy version", required: false, default: false, type: boolean}
      repair: {description: "Repair the current incomplete version", required: false, default: false, type: boolean}
      stage: {description: "Recovery stage label", required: false, default: all, type: string}

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
  # releasegraph's reusable workflow (v1, "provider reconciliation") labels the
  # release PR while reconciling provider state. A called workflow can never
  # request more than its caller, and a mismatch fails the whole run at startup
  # with no jobs, so this must stay in sync with that workflow.
  issues: write

jobs:
  release:
    uses: redtidev1918/releasegraph/.github/workflows/reusable-release.yml@d6d0bbec4e37bec025ab13de1783d4af96d6f925 # ReleaseGraph v1.4.8
    with:
      version: ${{ inputs.version || '' }}
      dry_run: ${{ github.event_name == 'pull_request' || inputs.dry_run || false }}
      force: ${{ inputs.force || false }}
      repair: ${{ github.event_name == 'pull_request' || inputs.repair || false }}
      stage: ${{ inputs.stage || 'all' }}
    secrets: inherit
