name: Package Smoke

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Tarball smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Deliberately the exact declared floor (engines.node >=22.13.0, the version where
          # `node:sqlite` stops being behind --experimental-sqlite). The gate therefore proves
          # the artifact works on the oldest supported runtime, not just on a recent one.
          # Broader version coverage (22.x, 24.x) lives in test.yml.
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release gate (pack -> install -> scripts=0 -> no native build -> no browser download -> boot -> storage -> login)
        run: node scripts/package-smoke.mjs
