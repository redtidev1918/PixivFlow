version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Asia/Shanghai
    labels: [dependencies]
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:30"
      timezone: Asia/Shanghai
    labels: [dependencies, github-actions]
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
