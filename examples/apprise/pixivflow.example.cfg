# Apprise channel configuration for the stateful key `pixivflow`.
# Replace examples with real URLs. Store secrets outside the PixivFlow repo,
# then mount the production file read-only (as this example is in Compose).
#
# One uncommented URL below is one fan-out target. Apprise supports 150+
# services; keep only the channels you need:
# https://github.com/caronc/apprise/wiki#notification-services

# SMTP email (Gmail app password example; many providers use mailtos://):
# mailtos://smtp.gmail.com:465?user=you%40gmail.com&pass=APP_PASSWORD&to=ops@example.com&name=PixivFlow

# Telegram bot:
# tgram://BOT_TOKEN/CHAT_ID/

# ntfy.sh / self-hosted ntfy:
# ntfy://ntfy.example.com/pixivflow_alerts

# Discord webhook:
# discord://WEBHOOK_ID/WEBHOOK_TOKEN
